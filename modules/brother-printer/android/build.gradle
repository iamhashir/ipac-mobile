plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.brotherprinter'
version = '0.7.10'

android {
  namespace "expo.modules.brotherprinter"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  flatDir {
    dirs 'libs'
  }
}

dependencies {
  // Compile against Brother BRLM classes; the app module packages the AAR.
  compileOnly fileTree(dir: 'libs', include: ['*.aar'])
}
